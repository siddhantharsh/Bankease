databases:
  - name: bankease-db
    plan: free
    databaseName: bankease
    user: bankease_user

services:
  - type: web
    name: bankease
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt && python init_db.py
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bankease-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.0"
